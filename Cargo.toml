[package]
name = "criptomeria-marketdata"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust app that subscribes to LOB/trade market data via cryptomeria-ingest and forwards it to a NATS broker"
repository = "https://github.com/fibonsai/criptomeria-marketdata"
keywords = ["crypto", "market-data", "nats", "order-book", "trades"]

[dependencies]
cryptomeria-ingest = { path = "../cryptomeria-ingest" }
async-nats = { version = "0.50", default-features = false }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

[profile.release]
lto = true